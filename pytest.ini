[pytest]
testpaths = tests
# ROS 2 (/opt/ros/humble, on PYTHONPATH in this workspace) registers pytest11 plugins that
# are irrelevant here and whose import chain dies on a missing `lark`. Disable the leaked
# ROS plugins by name rather than PYTEST_DISABLE_PLUGIN_AUTOLOAD, so `pytest` just works
# and non-ROS plugins (typeguard) still load.
addopts =
  -p no:launch_testing
  -p no:launch_ros
  -p no:ament_xmllint
  -p no:ament_flake8
  -p no:ament_copyright
  -p no:ament_pep257
  -p no:ament_lint
filterwarnings =
  ignore::DeprecationWarning
